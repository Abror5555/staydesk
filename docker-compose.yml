# PostgreSQL for local development and tests.
# Host port 5433 is used so it does not clash with a locally installed PostgreSQL on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: staydesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: staydesk
    ports:
      - "5433:5432"
    volumes:
      - staydesk-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staydesk-data:
